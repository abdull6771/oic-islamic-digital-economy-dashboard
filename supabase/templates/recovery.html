<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Reset your Digital Economy Policy Toolkit password</title>
  </head>
  <body>
    <h1>Reset your Digital Economy Policy Toolkit password</h1>
    <p>A password reset was requested for your internal toolkit account.</p>
    <p>Follow the link below to verify your email address and choose a new password.</p>
    <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
    <p>If you did not request a password reset, you can ignore this email.</p>
  </body>
</html>
